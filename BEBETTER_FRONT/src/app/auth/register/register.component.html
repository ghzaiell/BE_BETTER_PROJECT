<div class="form-container">
  <p class="title">Sign up</p>

  <form class="form" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" [(ngModel)]="username" name="username" autocomplete="username">
    </div>

    <div class="input-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" autocomplete="email">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" autocomplete="new-password">
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" autocomplete="new-password">
    </div>

    <button class="sign" type="submit" [disabled]="loading">
      {{ loading ? 'Creating account…' : 'Sign up' }}
    </button>
  </form>

  <p class="signup">
    Already have an account?
    <a routerLink="/auth/login">Sign in</a>
  </p>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
