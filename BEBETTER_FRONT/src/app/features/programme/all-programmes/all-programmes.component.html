<div class="programmes-container">

  <h2 class="title">Your Programmes</h2>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">Loading…</div>

  <!-- Error -->
  <div *ngIf="error" class="error">{{ error }}</div>

  <!-- No subjects -->
  <div *ngIf="!loading && subjects.length === 0" class="empty">
    <p>No programmes found.</p>
  </div>

  <!-- Subjects -->
  <div *ngFor="let s of subjects" class="subject-card">

    <!-- Horizontal Card Header -->
    <div class="subject-header" (click)="toggleMissions(s)">
      <div class="subject-info">
        <h3>{{ s.name }}</h3>
        <p>{{ s.description }}</p>

        <!-- Progress -->
        <ng-container *ngIf="progressOf(s) as p">
          <div class="progress-text">{{ p.done }} / {{ p.total }} missions · {{ p.percent }}%</div>
          <div class="progress-bar">
            <div class="progress-fill" [style.width.%]="p.percent"></div>
          </div>
        </ng-container>
      </div>

      <!-- Arrow -->
      <div class="arrow" [class.open]="s.showMissions">
        ➤
      </div>
    </div>

    <!-- Missions Section -->
    <div class="missions" *ngIf="s.showMissions">
      <div *ngFor="let m of s.missions" class="mission-item" [class.done]="m.etat">
        <input type="checkbox" [checked]="m.etat" [disabled]="m.etat"
               (click)="$event.preventDefault(); confirmMission(s, m)" />
        <div>
          <strong>{{ m.name }}</strong>
          <p>{{ m.description }}</p>
        </div>
      </div>
      <a class="open-link" [routerLink]="['../programme', s.id]">Open programme →</a>
    </div>

  </div>

</div>
